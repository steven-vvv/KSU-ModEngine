[workspace]
resolver = "3"
members = ["ipc-proto", "engine-core", "hostd", "runners/sandbox-common", "runners/runner-lua54", "runners/runner-qjs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rmp-serde = "1.3.1"
sha2 = "0.10.9"
thiserror = "2.0"
seccompiler = "0.5.0"
mlua = { version = "0.11.4", features = ["lua54", "vendored"] }
rquickjs = { version = "0.11.0", default-features = false, features = ["std"] }
ipc-proto = { path = "ipc-proto" }
engine-core = { path = "engine-core" }
sandbox-common = { path = "runners/sandbox-common" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
